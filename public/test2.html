<!DOCTYPE html>
<html>
<head>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ blocks: [{id: 1, type: 'teks', content: 'hello'}] }">
        <template x-for="(block, index) in blocks" :key="block.id">
            <div>
                <input type="text" :name="`content_blocks[${index}][type]`" :value="block.type">
            </div>
        </template>
    </div>
</body>
</html>
